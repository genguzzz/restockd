name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: web
        working-directory: web
        run: |
          npm ci
          npm run test
          npm run build
      - name: go
        run: |
          go vet ./...
          go test -race ./...
      - name: build linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o restockd-linux-amd64 ./cmd/restockd
      - uses: actions/upload-artifact@v4
        with:
          name: restockd-linux-amd64
          path: restockd-linux-amd64
